[DEPENDENCIES]
# Keep the web build lean: source art, development tools and preview images
# are not needed at runtime.  The sliced sprites in assets/sliced and the
# baked assets/generated/ground.png are included.
ignoreDirs = ["/tools", "/screenshots", "/assets/environment", "/.venv"]
ignoreFiles = ["README.md", "requirements-dev.txt", "ground_overview.png", "ashen_veil_player_frames.tres", "ashen_veil_turnaround_preview.png", "generate_ashen_veil_player.py"]
